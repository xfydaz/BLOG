<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>处方生成器 | 四模板完美复刻 · 标准条形码 · 自定义公章</title>
    <script
      src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
      tppabs="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
      tppabs="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
      tppabs="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
    ></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #eef2f5;
        font-family: "Times New Roman", "宋体", "SimSun", "微软雅黑", serif;
        padding: 30px 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }
      .generator-container {
        max-width: 1400px;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        justify-content: center;
      }
      /* 左侧控制面板 */
      .control-panel {
        flex: 1.2;
        min-width: 320px;
        background: white;
        border-radius: 24px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        padding: 24px 22px;
        height: fit-content;
        border: 1px solid #dee2e6;
        max-height: 90vh;
        overflow-y: auto;
      }
      .control-panel h3 {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 18px;
        border-left: 5px solid #c0392b;
        padding-left: 15px;
        color: #2c3e50;
      }
      .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }
      .btn {
        background: #f1f3f5;
        border: none;
        padding: 8px 16px;
        border-radius: 40px;
        font-weight: 500;
        font-size: 0.8rem;
        cursor: pointer;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #2c3e50;
      }
      .btn-primary {
        background: #1e7e34;
        color: white;
      }
      .btn-primary:hover {
        background: #16632a;
      }
      .btn-info {
        background: #2c7da0;
        color: white;
      }
      .btn-danger {
        background: #c0392b;
        color: white;
      }
      .btn-outline {
        border: 1px solid #ced4da;
        background: white;
      }
      .section-title {
        font-weight: 700;
        margin: 20px 0 10px;
        font-size: 0.9rem;
        border-bottom: 2px solid #e9ecef;
        padding-bottom: 5px;
      }
      .form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 12px;
      }
      .form-group {
        flex: 1;
        min-width: 120px;
      }
      .form-group label {
        font-size: 0.7rem;
        font-weight: 600;
        display: block;
        color: #6c757d;
        margin-bottom: 2px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ced4da;
        border-radius: 8px;
        font-size: 0.8rem;
      }
      .drugs-list-panel {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 10px;
        margin: 10px 0;
        max-height: 280px;
        overflow-y: auto;
      }
      .drug-item {
        background: white;
        border-radius: 10px;
        padding: 8px;
        margin-bottom: 8px;
        border: 1px solid #e9ecef;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .drug-item input {
        flex: 1;
        min-width: 70px;
        padding: 4px 6px;
        font-size: 0.7rem;
        border: 1px solid #dee2e6;
        border-radius: 6px;
      }
      .drug-item button {
        background: #fff0f0;
        border: none;
        padding: 4px 8px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.7rem;
        color: #b91c1c;
      }
      .add-drug-btn {
        width: 100%;
        margin-top: 6px;
        background: #e9ecef;
        border: none;
        padding: 6px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.75rem;
      }
      .upload-area {
        background: #f8f9fa;
        padding: 12px;
        border-radius: 16px;
        margin: 10px 0;
        border: 1px dashed #ced4da;
      }
      .stamp-control {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .stamp-control label {
        font-size: 0.7rem;
        font-weight: 600;
      }
      input[type="range"] {
        width: 80px;
      }
      .stamp-preview {
        width: 50px;
        height: 50px;
        border: 1px solid #ddd;
        border-radius: 8px;
        object-fit: contain;
        background: #f0f0f0;
      }

      /* 右侧处方卡片 */
      .prescription-area {
        flex: 3;
        min-width: 700px;
      }
      .pres-card {
        background: #ffffff;
        border-radius: 4px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        padding: 28px 32px 38px 32px;
        position: relative;
        font-family: "Times New Roman", "宋体", "SimSun", serif;
        border: 1px solid #e2e2e2;
      }
      /* 公章容器（左下角） */
      .stamp-container {
        position: absolute;
        bottom: 30px;
        left: 30px;
        width: 100px;
        height: 100px;
        pointer-events: none;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        background: transparent;
      }
      .stamp-img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        background: transparent;
      }
      /* 条形码容器（位置由模板控制） */
      .barcode-wrapper {
        text-align: right;
        margin: 16px 0 8px;
      }
      .barcode-canvas {
        display: inline-block;
        background: #fff;
        padding: 2px;
        border: 1px solid #ddd;
      }
      /* 内蒙古模板 */
      .pres-card.tpl-nmg {
        border-top: 3px solid #2c6e2c;
      }
      .pres-card.tpl-nmg .hospital-name {
        font-size: 1.8rem;
        font-weight: 800;
        color: #2c6e2c;
        text-align: center;
      }
      .pres-card.tpl-nmg .hospital-sub {
        text-align: center;
        font-size: 0.8rem;
        border-bottom: 1px solid #e9ecef;
        padding-bottom: 12px;
        margin-bottom: 16px;
      }
      .pres-card.tpl-nmg .info-section {
        background: #fafbfc;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #eef2f6;
        margin-bottom: 16px;
      }
      .pres-card.tpl-nmg .info-row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 8px;
        font-size: 0.85rem;
      }
      .pres-card.tpl-nmg .info-label {
        font-weight: 700;
        min-width: 90px;
        display: inline-block;
      }
      .pres-card.tpl-nmg .drug-table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-size: 0.8rem;
      }
      .pres-card.tpl-nmg .drug-table th,
      .pres-card.tpl-nmg .drug-table td {
        border: 1px solid #dee2e6;
        padding: 8px 6px;
        text-align: left;
      }
      .pres-card.tpl-nmg .drug-table th {
        background: #f1f3f5;
        text-align: center;
      }
      .pres-card.tpl-nmg .sign-line {
        margin-top: 16px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        font-size: 0.85rem;
      }
      .pres-card.tpl-nmg .footer-note {
        font-size: 0.65rem;
        color: #6c757d;
        text-align: center;
        margin-top: 20px;
        border-top: 1px solid #e9ecef;
        padding-top: 12px;
      }
      /* 珠海模板 */
      .pres-card.tpl-zhuhai {
        border-top: 4px solid #c0392b;
      }
      .pres-card.tpl-zhuhai .hospital-name-top {
        font-size: 1.4rem;
        font-weight: 800;
        color: #b22234;
        text-align: center;
      }
      .pres-card.tpl-zhuhai .hospital-name-main {
        font-size: 1.2rem;
        font-weight: 800;
        color: #b22234;
        text-align: center;
      }
      .pres-card.tpl-zhuhai .hospital-sub {
        text-align: center;
        font-size: 0.75rem;
        color: #6c757d;
        margin-bottom: 16px;
      }
      .pres-card.tpl-zhuhai .info-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        background: #fafbfc;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 0.85rem;
      }
      .pres-card.tpl-zhuhai .info-item {
        flex: 1 1 150px;
      }
      .pres-card.tpl-zhuhai .drug-block {
        margin: 20px 0;
      }
      .pres-card.tpl-zhuhai .drug-item-line {
        margin: 8px 0;
        font-family: monospace;
      }
      .pres-card.tpl-zhuhai .sign-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        margin: 20px 0;
        padding-top: 12px;
        border-top: 1px dashed #dee2e6;
        gap: 12px;
        font-size: 0.8rem;
      }
      .pres-card.tpl-zhuhai .footer-note {
        font-size: 0.65rem;
        color: #6c757d;
        text-align: center;
        margin-top: 20px;
        border-top: 1px solid #e9ecef;
        padding-top: 12px;
      }
      /* 成都模板 */
      .pres-card.tpl-chengdu {
        border-top: 3px solid #2c6e9e;
      }
      .pres-card.tpl-chengdu .hospital-name {
        font-size: 1.6rem;
        font-weight: 800;
        color: #2c6e9e;
        text-align: center;
      }
      .pres-card.tpl-chengdu .prescription-title {
        text-align: center;
        font-size: 1.2rem;
        margin-bottom: 20px;
      }
      .pres-card.tpl-chengdu .info-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        background: #fafbfc;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 0.85rem;
      }
      .pres-card.tpl-chengdu .info-item {
        flex: 1 1 160px;
      }
      .pres-card.tpl-chengdu .drug-block {
        margin: 20px 0;
      }
      .pres-card.tpl-chengdu .sign-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        margin: 16px 0;
        font-size: 0.85rem;
      }
      .pres-card.tpl-chengdu .footer-note {
        font-size: 0.65rem;
        color: #6c757d;
        text-align: center;
        margin-top: 20px;
        border-top: 1px solid #e9ecef;
        padding-top: 12px;
      }
      /* LaTeX 模板 */
      .pres-card.tpl-latex {
        font-family: "Times New Roman", "SimSun", "宋体", serif;
        line-height: 1.4;
        position: relative;
        min-height: 800px;
        padding: 20px 25px;
      }
      .latex-tag-common {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 18pt;
        font-weight: bold;
        border: 2px solid #c0392b;
        padding: 4px 16px;
        color: #c0392b;
        background: white;
        font-family: "黑体", sans-serif;
      }
      .latex-barcode {
        position: absolute;
        top: 30px;
        left: 20px;
        width: 220px;
        height: 50px;
      }
      .latex-qrcode {
        position: absolute;
        bottom: 80px;
        right: 20px;
        width: 80px;
        height: 80px;
      }
      .latex-header {
        text-align: center;
        margin: 20px 0 25px;
      }
      .latex-hospital {
        font-size: 20pt;
        font-weight: bold;
        font-family: "黑体", sans-serif;
      }
      .latex-prescription-title {
        font-size: 28pt;
        font-weight: bold;
        letter-spacing: 8px;
        margin-top: 8px;
        font-family: "黑体", sans-serif;
      }
      .latex-info-line {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        margin: 8px 0;
        font-size: 14pt;
      }
      .latex-info-item {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        white-space: nowrap;
      }
      .latex-underline {
        border-bottom: 1px solid #000;
        min-width: 100px;
        display: inline-block;
        padding: 0 4px;
      }
      .latex-diagnosis {
        margin: 12px 0;
        font-size: 14pt;
      }
      .latex-rp {
        font-size: 36pt;
        font-weight: bold;
        font-family: monospace;
        margin: 20px 0 10px;
        letter-spacing: 4px;
      }
      .latex-drug-item {
        margin: 16px 0 4px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .latex-drug-name {
        font-size: 16pt;
        font-weight: normal;
      }
      .latex-drug-qty {
        font-size: 14pt;
        white-space: nowrap;
      }
      .latex-drug-usage {
        margin-left: 2em;
        font-size: 12pt;
        color: #333;
        margin-bottom: 12px;
      }
      .latex-sign-row {
        display: flex;
        justify-content: space-between;
        margin: 16px 0;
        font-size: 14pt;
      }
      .latex-footer {
        font-size: 10pt;
        margin-top: 30px;
        border-top: 1px solid #aaa;
        padding-top: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="generator-container">
      <div class="control-panel">
        <h3><i class="fas fa-prescription-bottle-alt"></i> 处方编辑控制台</h3>
        <div class="btn-group">
          <button class="btn btn-primary" id="randomAllBtn">随机全部</button>
          <button class="btn btn-info" id="switchTemplateBtn">切换模板</button>
          <button class="btn btn-danger" id="saveImageBtn">保存为图片</button>
          <button class="btn btn-primary" id="savePdfBtn">保存为PDF</button>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>当前模板</label>
            <select id="templateSelect">
              <option value="latex">专业处方模板</option>
              <option value="nmg">内蒙古自治区中医医院</option>
              <option value="zhuhai">珠海高新区人民医院</option>
              <option value="chengdu">成都市第三人民医院</option>
            </select>
          </div>
        </div>

        <!-- 通用字段 -->
        <div class="section-title">患者信息</div>
        <div class="form-row">
          <div class="form-group">
            <label>姓名</label
            ><input type="text" id="name_common" value="羊女士" />
          </div>
          <div class="form-group">
            <label>性别</label
            ><select id="gender_common">
              <option>男</option>
              <option>女</option>
            </select>
          </div>
          <div class="form-group">
            <label>年龄</label
            ><input type="text" id="age_common" value="45岁" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>科室</label
            ><input type="text" id="dept_common" value="急诊科" />
          </div>
          <div class="form-group">
            <label>门诊号</label
            ><input type="text" id="pid_common" value="11451419810" />
          </div>
          <div class="form-group">
            <label>费别</label
            ><input type="text" id="fee_common" value="普通病人" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>处方编号</label
            ><input type="text" id="prescNo_common" value="20250408001" />
          </div>
          <div class="form-group">
            <label>日期</label
            ><input type="text" id="date_common" value="2025-04-08" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>诊断/证型</label
            ><input type="text" id="diag_common" value="急性网络社交障碍" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>地址</label
            ><input type="text" id="address_common" value="" />
          </div>
          <div class="form-group">
            <label>电话</label><input type="text" id="phone_common" value="" />
          </div>
        </div>

        <!-- 药品管理 -->
        <div class="section-title">药品管理</div>
        <div id="drugsListCommon" class="drugs-list-panel"></div>
        <button id="addDrugCommonBtn" class="add-drug-btn">添加药品</button>

        <div class="section-title">费用信息</div>
        <div class="form-row">
          <div class="form-group">
            <label>药品金额(元)</label
            ><input
              type="number"
              step="0.01"
              id="amount_common"
              value="178.00"
            />
          </div>
        </div>
        <div class="form-row" id="nmgExtraFees" style="display: none">
          <div class="form-group">
            <label>中草药费(元)</label
            ><input type="number" step="0.01" id="herbFee_nmg" value="135.63" />
          </div>
          <div class="form-group">
            <label>煎药费(元)</label
            ><input
              type="number"
              step="0.01"
              id="decoctionFee_nmg"
              value="28.00"
            />
          </div>
          <div class="form-group">
            <label>剂数</label><input type="text" id="dosage_nmg" value="7" />
          </div>
        </div>

        <div class="section-title">手写签名</div>
        <div class="form-row">
          <div class="form-group">
            <label>医师</label
            ><input type="text" id="doctor_common" value="赵紫羊" />
          </div>
          <div class="form-group">
            <label>审核</label
            ><input type="text" id="auditor_common" value="李审核" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>调配</label
            ><input type="text" id="dispenser_common" value="王调剂" />
          </div>
          <div class="form-group">
            <label>核对</label
            ><input type="text" id="checker_common" value="赵核对" />
          </div>
          <div class="form-group">
            <label>发药</label
            ><input type="text" id="deliver_common" value="周发药" />
          </div>
        </div>

        <!-- 公章上传 -->
        <div class="section-title">真实公章（左下角）</div>
        <div class="upload-area">
          <input
            type="file"
            id="stampUpload"
            accept="image/png,image/jpeg,image/webp"
          />
          <div class="stamp-control">
            <label>宽度</label
            ><input
              type="range"
              id="stampWidth"
              min="50"
              max="150"
              value="100"
              step="2"
            /><span id="widthVal">100px</span> <label>左偏移</label
            ><input
              type="range"
              id="stampLeft"
              min="10"
              max="80"
              value="30"
              step="1"
            /><span id="leftVal">30px</span> <label>下偏移</label
            ><input
              type="range"
              id="stampBottom"
              min="10"
              max="80"
              value="30"
              step="1"
            /><span id="bottomVal">30px</span>
            <button id="clearStampBtn" class="btn btn-outline">清除</button>
          </div>
          <div>
            <img
              id="stampPreview"
              class="stamp-preview"
              style="display: none"
            />
          </div>
        </div>
        <hr />
        <div style="font-size: 0.7rem; text-align: center">
          右侧处方实时更新，保存图片/PDF无编辑框
        </div>
      </div>

      <div class="prescription-area">
        <div id="prescriptionContainer"></div>
      </div>
    </div>

    <script>
      // ---------- 全局数据 ----------
      let currentTemplate = "latex";
      let commonDrugs = [
        {
          name: "宜家 BLÅHAJ 布罗艾 鲨鱼 100 厘米",
          qty: "1 头",
          usage: "1头 外用 按需使用 慢性病",
        },
        {
          name: "宜家 BLÅHAJ 布罗艾 幼鲨 55 厘米",
          qty: "1 头",
          usage: "1头 外用 按需使用 慢性病",
        },
      ];
      let stampImageData = null;

      // 随机数据池
      const names = ["羊女士", "张明", "李芳", "王强", "刘静", "陈伟", "赵杰"];
      const genders = ["男", "女"];
      const depts = ["急诊科", "内科", "皮肤科", "神经内科"];
      const diags = [
        "急性网络社交障碍",
        "上呼吸道感染",
        "高血压病",
        "2型糖尿病",
        "冠心病",
      ];

      // 标准 Code39 条形码生成器（窄条1px，宽条2px，间隔1px，起始/终止符*）
      function generateCode39(canvasId, code) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const width = 280;
        const height = 40;
        canvas.width = width;
        canvas.height = height;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        if (!code) code = "NOCODE";
        // Code39 编码映射（9位，1表示宽条/宽空，0表示窄条/窄空，但通常绘制时条用黑色，空用白色）
        const code39Map = {
          0: "101001101101",
          1: "110100101011",
          2: "101100101011",
          3: "110110010101",
          4: "101001101011",
          5: "110100110101",
          6: "101100110101",
          7: "101001011011",
          8: "110100101101",
          9: "101100101101",
          A: "110101001011",
          B: "101101001011",
          C: "110110100101",
          D: "101011001011",
          E: "110101100101",
          F: "101101100101",
          G: "101010011011",
          H: "110101001101",
          I: "101101001101",
          J: "101011001101",
          K: "110101010011",
          L: "101101010011",
          M: "110110101001",
          N: "101011010011",
          O: "110101101001",
          P: "101101101001",
          Q: "101010110011",
          R: "110101011001",
          S: "101101011001",
          T: "101011011001",
          U: "110010101011",
          V: "100110101011",
          W: "110011010101",
          X: "100101101011",
          Y: "110010110101",
          Z: "100110110101",
          "-": "100101011011",
          ".": "110010101101",
          " ": "100110101101",
          $: "100100100101",
          "/": "100100101001",
          "+": "100101001001",
          "%": "101001001001",
          "*": "100101101101",
        };
        let fullCode = "*" + code.toUpperCase() + "*";
        let binary = "";
        for (let i = 0; i < fullCode.length; i++) {
          let ch = fullCode[i];
          let pattern = code39Map[ch];
          if (!pattern) pattern = code39Map["*"];
          binary += pattern + "0"; // 字符间加一个窄空
        }
        let x = 10;
        for (let i = 0; i < binary.length && x < width - 10; i++) {
          let bit = binary[i];
          let barWidth = bit === "1" ? 2 : 1; // 宽条2px，窄条1px
          if (i % 2 === 0) {
            // 条（黑色）
            ctx.fillStyle = "#000000";
            ctx.fillRect(x, 4, barWidth, height - 8);
          } // 空（白色）不需要绘制
          x += barWidth + 1;
        }
        ctx.fillStyle = "#000";
        ctx.font = "11px monospace";
        ctx.fillText(code, width / 2 - 30, height - 6);
      }

      // 公章上传与设置（统一使用左下角容器）
      function initStampControls() {
        const upload = document.getElementById("stampUpload");
        const widthSlider = document.getElementById("stampWidth");
        const leftSlider = document.getElementById("stampLeft");
        const bottomSlider = document.getElementById("stampBottom");
        const widthVal = document.getElementById("widthVal");
        const leftVal = document.getElementById("leftVal");
        const bottomVal = document.getElementById("bottomVal");
        const clearBtn = document.getElementById("clearStampBtn");
        const preview = document.getElementById("stampPreview");

        upload.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              stampImageData = ev.target.result;
              preview.src = stampImageData;
              preview.style.display = "block";
              applyStampSettings();
            };
            reader.readAsDataURL(file);
          }
        });

        function applyStampSettings() {
          const img = document.getElementById("customStampImg");
          if (!img) return;
          if (stampImageData) {
            img.src = stampImageData;
            img.style.display = "block";
          } else {
            img.style.display = "none";
            return;
          }
          const width = widthSlider.value;
          const left = leftSlider.value;
          const bottom = bottomSlider.value;
          const container = document.getElementById("stampContainer");
          if (container) {
            container.style.width = width + "px";
            container.style.bottom = bottom + "px";
            container.style.left = left + "px";
            container.style.right = "auto";
          }
        }
        window.applyStampSettings = applyStampSettings;
        widthSlider.addEventListener("input", () => {
          widthVal.innerText = widthSlider.value + "px";
          applyStampSettings();
        });
        leftSlider.addEventListener("input", () => {
          leftVal.innerText = leftSlider.value + "px";
          applyStampSettings();
        });
        bottomSlider.addEventListener("input", () => {
          bottomVal.innerText = bottomSlider.value + "px";
          applyStampSettings();
        });
        clearBtn.addEventListener("click", () => {
          stampImageData = null;
          const img = document.getElementById("customStampImg");
          if (img) img.style.display = "none";
          preview.style.display = "none";
          upload.value = "";
        });
      }

      async function saveAsImage() {
        const card = document.getElementById("prescriptionCard");
        if (!card) {
          alert("未找到处方卡片");
          return;
        }
        document.body.style.overflow = "hidden";
        try {
          const canvas = await html2canvas(card, {
            scale: 3,
            backgroundColor: "#ffffff",
            logging: false,
            useCORS: false,
          });
          const link = document.createElement("a");
          link.download = `处方_${currentTemplate}_${Date.now()}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        } catch (err) {
          alert("保存图片失败: " + err.message);
        } finally {
          document.body.style.overflow = "";
        }
      }

      async function saveAsPdf() {
        const card = document.getElementById("prescriptionCard");
        if (!card) {
          alert("未找到处方卡片");
          return;
        }
        document.body.style.overflow = "hidden";
        try {
          const canvas = await html2canvas(card, {
            scale: 3,
            backgroundColor: "#ffffff",
            logging: false,
            useCORS: false,
          });
          const imgData = canvas.toDataURL("image/png");
          const { jsPDF } = window.jspdf;
          const imgWidth = 210;
          const imgHeight = (canvas.height * imgWidth) / canvas.width;
          let pdf = new jsPDF("p", "mm", "a4");
          pdf.addImage(imgData, "PNG", 0, 0, imgWidth, imgHeight);
          pdf.save(`处方_${currentTemplate}_${Date.now()}.pdf`);
        } catch (err) {
          alert("保存PDF失败: " + err.message);
        } finally {
          document.body.style.overflow = "";
        }
      }

      function switchTemplate() {
        currentTemplate = document.getElementById("templateSelect").value;
        updatePrescriptionDisplay();
      }

      function init() {
        renderDrugList();
        updatePrescriptionDisplay();
        initStampControls();
        document.getElementById("randomAllBtn").onclick = randomAll;
        document.getElementById("switchTemplateBtn").onclick = switchTemplate;
        document.getElementById("saveImageBtn").onclick = saveAsImage;
        document.getElementById("savePdfBtn").onclick = saveAsPdf;
        document.getElementById("addDrugCommonBtn").onclick = addDrug;
        document
          .getElementById("templateSelect")
          .addEventListener("change", switchTemplate);
        const inputs = [
          "name_common",
          "gender_common",
          "age_common",
          "dept_common",
          "pid_common",
          "fee_common",
          "prescNo_common",
          "date_common",
          "diag_common",
          "amount_common",
          "address_common",
          "phone_common",
          "herbFee_nmg",
          "decoctionFee_nmg",
          "dosage_nmg",
          "doctor_common",
          "auditor_common",
          "dispenser_common",
          "checker_common",
          "deliver_common",
        ];
        inputs.forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.addEventListener("input", updatePrescriptionDisplay);
        });
      }
      init();
    </script>
  </body>
</html>
